<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بنك أسئلة أساسيات الشبكات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0D1117; --surface:#161B22; --surface-2:#1C232C; --border:#2A323C;
  --text:#E6EDF3; --muted:#8B98A5; --blue:#2563EB; --blue-soft:rgba(37,99,235,.16);
  --amber:#E8A000; --ok:#2EA043; --ok-soft:rgba(46,160,67,.16);
  --bad:#F85149; --bad-soft:rgba(248,81,73,.16);
  --font:'Tajawal',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
:root[data-theme="light"]{
  --bg:#F6F8FA; --surface:#FFFFFF; --surface-2:#F0F3F6; --border:#D8DEE4;
  --text:#1F2328; --muted:#59636E; --blue:#2563EB; --blue-soft:rgba(37,99,235,.10);
  --amber:#B97800; --ok:#1A7F37; --ok-soft:rgba(26,127,55,.10);
  --bad:#CF222E; --bad-soft:rgba(207,34,46,.09);
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:150px}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.ltr{direction:ltr;unicode-bidi:isolate;font-family:var(--mono)}

header{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--border)}
.bar{max-width:760px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.bar h1{font-size:1.05rem;font-weight:700}
.total{font-size:.85rem;color:var(--muted)}
.total b{color:var(--text);font-family:var(--mono);font-weight:700}
.icon-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;font-size:1.1rem}
.icon-btn:hover{border-color:var(--blue)}
.tabs{max-width:760px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;padding:0 16px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:10px 14px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap;min-height:44px}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--amber);font-weight:700}
.tab small{font-family:var(--mono);font-size:.72rem;color:var(--muted);margin-inline-start:6px}
.tab.done small{color:var(--ok)}

main{max-width:760px;margin:0 auto;padding:24px 16px 80px}
.head h2{font-size:1.3rem;font-weight:700;line-height:1.5}
.head p{color:var(--muted);font-size:.9rem;margin-top:2px}
.progress{height:6px;border-radius:99px;background:var(--surface-2);margin:16px 0 12px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--blue);transition:width .3s}
.meta{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.stats{display:flex;gap:16px;font-size:.88rem;color:var(--muted)}
.stats b{font-family:var(--mono);color:var(--text)}
.stats .ok b{color:var(--ok)} .stats .bad b{color:var(--bad)}
.tools{display:flex;gap:8px;align-items:center}
.seg{display:flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{padding:6px 12px;font-size:.85rem;color:var(--muted);min-height:36px}
.seg button[aria-pressed="true"]{background:var(--blue-soft);color:var(--text);font-weight:700}
.reset{font-size:.85rem;color:var(--muted);padding:6px 12px;border:1px solid var(--border);border-radius:10px;min-height:36px}
.reset:hover{color:var(--bad);border-color:var(--bad)}

.list{display:flex;flex-direction:column;gap:16px;margin-top:20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px}
.card.ok{border-color:var(--ok)} .card.bad{border-color:var(--bad)}
.qhead{display:flex;gap:12px;align-items:flex-start}
.num{flex:0 0 auto;min-width:36px;height:28px;padding:0 8px;border-radius:8px;background:var(--surface-2);color:var(--amber);font-family:var(--mono);font-size:.82rem;font-weight:700;display:grid;place-items:center;margin-top:2px}
.q{font-weight:500;font-size:1.02rem}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.opt{display:flex;align-items:flex-start;gap:12px;text-align:start;width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);min-height:48px;transition:border-color .15s,background .15s}
.opt:not(:disabled):hover{border-color:var(--blue);background:var(--blue-soft)}
.opt:disabled{cursor:default}
.lt{flex:0 0 auto;width:26px;height:26px;border-radius:50%;border:1px solid var(--border);display:grid;place-items:center;font-size:.82rem;font-weight:700;color:var(--muted);margin-top:1px}
.ot{flex:1;overflow-wrap:anywhere}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .lt{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .lt{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.fb{margin-top:12px;font-size:.92rem;font-weight:700;display:flex;gap:8px;align-items:center}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)}
.fb span.sub{font-weight:400;color:var(--muted)}

.result{margin-top:24px;padding:24px;text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:14px}
.result .big{font-family:var(--mono);font-size:2rem;font-weight:700;color:var(--amber)}
.result p{color:var(--muted);margin:4px 0 16px}
.btn{display:inline-block;padding:10px 20px;border-radius:10px;background:var(--blue);color:#fff;font-weight:700;min-height:44px}
.btn:hover{filter:brightness(1.1)}
.empty{text-align:center;color:var(--muted);padding:32px 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(max-width:520px){.card{padding:14px}.meta{flex-direction:column;align-items:stretch}.tools{justify-content:space-between}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>بنك أسئلة أساسيات الشبكات</h1>
    <div style="display:flex;align-items:center;gap:12px">
      <div class="total" id="total"></div>
      <button class="icon-btn" id="theme" aria-label="تبديل المظهر" title="تبديل المظهر"></button>
    </div>
  </div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="المحاضرات"></nav>
</header>
<main id="main">
  <div class="head"><h2 id="title"></h2><p id="range"></p></div>
  <div class="progress" aria-hidden="true"><i id="bar"></i></div>
  <div class="meta">
    <div class="stats" id="stats"></div>
    <div class="tools">
      <div class="seg" role="group" aria-label="تصفية الأسئلة">
        <button data-f="all" aria-pressed="true">الكل</button>
        <button data-f="todo" aria-pressed="false">غير المجاب</button>
        <button data-f="wrong" aria-pressed="false">الخاطئة</button>
      </div>
      <button class="reset" id="reset">إعادة المحاضرة</button>
    </div>
  </div>
  <div class="list" id="list"></div>
  <div id="end"></div>
</main>
<div class="sr" id="live" aria-live="polite"></div>

<script>
const D=[[1,"تقتصر شبكة المنطقة المحلية LAN عادةً على:",["موقع جغرافي معين كمبنى أو مكتب أو قسم","عدة دول","قارة كاملة","الإنترنت بأكمله"],0],[2,"ما الذي يعنيه اختصار LAN؟",["Large Area Network","Link Access Node","Logical Area Network","Local Area Network"],3],[3,"لماذا يُفضَّل تقسيم شبكة LAN الكبيرة إلى شبكات فرعية تسمى مجموعات العمل Workgroups؟",["لزيادة عدد الكابلات","لتسهيل إدارة الشبكة وتحسين مستوى الحماية","لتخفيض سرعة الشبكة","لإلغاء الحاجة إلى الأجهزة"],1],[4,"ما الحل المقترح لمشكلة الوصول بين شبكتي LAN المنفصلتين؟",["إضافة كابل USB","استخدام جهاز هاب فقط","استخدام جهاز راوتر لربط الشبكتين","إلغاء إحدى الشبكتين"],2],[5,"الراوتر في مثال الأقسام:",["يفصل مجموعات العمل (من الناحية الإدارية) مع إمكانية السماح بالاتصال بينها","يعمل كطابعة","يمنع أي اتصال بين الأقسام","يدمج جميع الأقسام في شبكة واحدة"],0],[6,"العناصر الثلاثة الأكثر شيوعاً في مكونات الشبكة هي:",["الكابل، الهوائي، الشاشة","الراوتر، الهاب، الجسر","TCP، UDP، IP","جهاز الحاسوب، السيرفر، الأجهزة الأخرى"],3],[7,"السيرفر هو:",["جهاز حاسوب بمواصفات عالية وإمكانيات قوية يقدم الخدمات لأجهزة الشبكة","جهاز بمواصفات ضعيفة","برنامج تصفح","كرت شبكة خارجي"],0],[8,"السيرفر الذي يُستخدم لحفظ وتخزين الملفات هو:",["Fax Server","Proxy Server","File Server","Mail Server"],2],[9,"السيرفر الذي يتعامل مع وظائف البريد الإلكتروني هو:",["Print Server","Mail Server","Web Server","Telephony Server"],1],[10,"السيرفر الذي يتحكم بالطابعات على الشبكة هو:",["Print Server","Proxy Server","File Server","Application Server"],0],[11,"السيرفر الذي يدير العمليات المعتمدة على الويب ويستضيف محتوى المواقع هو:",["Mail Server","Fax Server","Print Server","Web Server"],3],[12,"السيرفر الذي يتولى المهام نيابةً عن أجهزة أخرى خاصةً عملية الاتصال بالإنترنت هو:",["Proxy Server","File Server","Mail Server","Print Server"],0],[13,"أبسط مثال على شبكة المناطق الواسعة WAN هو:",["شبكة غرفة واحدة","شبكة الإنترنت","قسم واحد في شركة","طابعة متصلة بحاسوب"],1],[14,"كرت الشبكة يرتبط دائماً بالعنوان الفيزيائي المعروف باسم:",["رقم الهاتف","IP العام فقط","MAC Address","اسم النطاق"],2],[15,"جهاز Hub هو:",["جهاز حماية","جهاز ذكي جداً يوجّه الرسائل بحسب MAC","جهاز يعمل في الطبقة الثالثة","أحد أنواع أجهزة الشبكة القديمة يربط جميع أجزاء الشبكة بشكل سلكي ببنية نجمية"],3],[16,"كيف يعمل جهاز Hub في إرسال الرسائل؟",["يخزنها حتى يطلبها المستخدم","يرسلها إلى المنفذ الهدف فقط","يكرر الرسالة عبر كل المنافذ ما عدا المنفذ الذي وردت منه","يحذفها"],2],[17,"يُعتبر جهاز Hub:",["كل منفذ منطقة تصادم منفصلة","منطقة تصادم واحدة (Collision Domain)","يعمل بنمط Full Duplex دائماً","جهازاً خالياً من التصادم"],1],[18,"الآلية المستخدمة لتجنب التصادم في Hub هي:",["CSMA/CD (تحسس الحامل واكتشاف التصادم)","NAT","STP","DHCP"],0],[19,"لماذا لا يُنصح باستخدام Hub اليوم لوصل الأجهزة؟",["لأنه يعمل في الطبقة السابعة","لأنه غالٍ جداً","لافتقاده لسرية البيانات (كل رسالة تُرسل إلى جميع الأجهزة) واستهلاكه الزائد لعرض الحزمة","لأنه لا يدعم الكابلات"],2],[20,"وظيفة جهاز Bridge الأساسية هي:",["تشفير الاتصال","الحفاظ على فصل حركة البيانات على جانبيه وتقسيم الشبكة إلى مناطق تصادم أصغر","توجيه الحزم بين الشبكات عبر IP","ترجمة العناوين"],1],[21,"كيف يختلف Switch عن Hub في إرسال الرسالة؟",["يرسلها إلى كل المنافذ","يرسلها إلى الراوتر دائماً","يرسل الرسالة فقط إلى المنفذ المتصل به الجهاز الهدف","لا يرسلها أبداً"],2],[22,"يعتمد Switch في توجيه الرسائل على:",["رقم VLAN فقط","عنوان IPv6 فقط","عنوان MAC للجهاز الوجهة","اسم المستخدم"],2],[23,"كل منفذ في Switch يُعتبر:",["منطقة تصادم واحدة مشتركة","منطقة تصادم منفصلة","منطقة بث فقط","جهازاً بعنوان IP مستقل"],1],[24,"يستخدم الراوتر في اتخاذ قرارات التوجيه:",["أسماء المستخدمين","عناوين MAC فقط","عناوين IP","ألوان الكابلات"],2],[25,"أجهزة الراوتر تُعتبر أجهزة:",["طبقة أولى فقط","طبقة ثالثة","طبقة سابعة فقط","طبقة ثانية فقط"],1],[26,"الفرق بين الراوتر المنزلي وراوتر الشركات هو أن الراوتر المنزلي:",["يحتوي على أكسس بوينت مدمج للاتصال اللاسلكي ويحتاج غالباً منفذين فقط","لا يدعم IP","لا يمكنه الاتصال بالإنترنت","يملك عشرات المنافذ دائماً"],0],[27,"هل يُعتبر الراوتر من أجهزة الحماية بشكل أساسي؟",["نعم، هو الجهاز الأمني الوحيد","نعم، يغني ع ,"ICMPv6 مع Neighbor Discovery Protocol","DHCP","NAT"],1],[221,"الحاجة إلى NAT في IPv6:",["لا يوجد حاجة لاستخدام NAT لأن عدد العناوين كبير جداً وكل جهاز يخصص له عنوان IP عام","غير ممكنة","ضرورية كما في IPv4","ضرورية دائماً"],0],[222,"الاختصار (::) في IPv6 يعني حذف مجموعات الأصفار ويمكن استخدامه:",["في كل مجموعة","عدة مرات","مرة واحدة فقط في العنوان","لا يمكن استخدامه"],2],[223,"الصيغة المختصرة للعنوان 00:0000:0000:0001:0000:0000:0000:56FE هي:",["00::1:56FE::","00:0:1:56FE","00:0:0:1::56FE","00::1::56FE"],2],[224,"عنوان Anycast في IPv6 يعني أن حزمة البيانات:",["تحذف","تسلم لكل interfaces","تسلم لواحدة فقط عشوائياً","يتم استلامها من قبل أقرب interface له هذا العنوان"],3],[225,"عنوان Multicast في IPv6 يعني أن حزم البيانات:",["تسلم لواحد فقط","تسلم لأقرب واحد","تسلم لكل interface معرَّف بهذا العنوان","تحذف"],2],[226,"في IPv6 لا يوجد عنوان:",["unicast","broadcast","multicast","anycast"],1],[227,"عنوان loopback في IPv6 هو:",["::1/128","fc00::/7","::/128","fe80::/10"],0],[228,"النطاق fc00::/7 يمثل:",["Loopback","Unique-local","Link-scoped unicast","للتوثيق"],1],[229,"النطاق fe80::/10 يمثل:",["للتوثيق","Link-scoped unicast","Loopback","Unique-local"],1],[230,"البروتوكول TCP يعتبر connection oriented لأنه:",["يستخدم Broadcast","يؤسس الاتصال من خلال مصافحة ثلاثية ويملك آلية لقطع الاتصال","لا يرسل","لا يؤسس اتصالاً"],1],[231,"البروتوكول الذي يعتبر connectionless هو:",["TCP","SSH","UDP","BGP"],2],[232,"حجم حقل Sequence Number في TCP:",["8 bits","9 bits","32 bits","16 bits"],2],[233,"العلم RST يُستخدم للإشارة إلى:",["قطع الاتصال بشكل فوري","بدء الاتصال","الإعلام","بيانات مستعجلة"],0],[234,"العلم SYN لـ:",["قطع فوري","الاستعجال","إنهاء الاتصال","بدء عملية المزامنة (الاتصال) ويجب أن يكون مضبوطاً فقط ضمن أول حزمة بيانات من كل جهاز"],3],[235,"العلم FIN للإشارة إلى:",["الاستعجال","قطع فوري","بدء الاتصال","عدم وجود المزيد من البيانات المراد إرسالها (إنهاء الاتصال)"],3],[236,"حجم حقل Window في TCP:",["8 bits","9 bits","16 bits","32 bits"],2],[237,"الحزمة الأولى في المصافحة الثلاثية هي:",["ACK","FIN","SYN","SYN-ACK"],2],[238,"الحزمة الثانية هي:",["FIN","ACK-SYN من السيرفر","SYN من المستخدم","ACK من المستخدم"],1],[239,"في ACK-SYN يرسل السيرفر رقم إعلام قيمته:",["X+1","X","Y","Y+1"],0],[240,"الحزمة الثالثة (ACK) من المستخدم يطلب فيها الحزمة التي لها الرقم التسلسلي:",["Y","X","Y+1","X+1"],2],[241,"تكون TCP Socket مكونة من:",["عنوان IP ورقم المنفذ port والبروتوكول المستخدم","MAC فقط","SSID وBSSID","IP فقط"],0],[242,"المستخدم يختار source port:",["رقم عشوائي أكبر من 1024","أقل من 100","80 دائماً","21 دائماً"],0],[243,"رقم منفذ FTP:",["25","22","23","21"],3],[244,"رقم منفذ SSH:",["21","23","22","80"],2],[245,"رقم منفذ Telnet:",["22","23","25","53"],1],[246,"رقم منفذ SMTP:",["80","25","143","443"],1],[247,"رقم منفذ DNS:",["53","143","80","179"],0],[248,"رقم منفذ HTTP:",["21","53","443","80"],3],[249,"رقم منفذ IMAP:",["25","443","143","179"],2],[250,"رقم منفذ BGP:",["53","443","179","143"],2],[251,"رقم منفذ HTTPS:",["22","443","23","80"],1],[252,"بروتوكول SSH يستخدم لـ:",["نقل البريد","التصفح العادي","DNS","إدارة الأجهزة عن بعد عبر قناة مشفرة"],3],[253,"بروتوكول Telnet يستخدم لإدارة الأجهزة عن بعد لكنه:",["يعمل بـ UDP","مشفر بالكامل","غير آمن","لا يستخدم منافذ"],2],[254,"بروتوكول DNS يستخدم لطلب عنوان IP لاسم دومين عبر:",["UDP والبورت 53","TCP والبورت 80","UDP والبورت 67","TCP والبورت 443"],0],[255,"HTTPS يتم الحصول عليه باستخدام:",["ARP","DHCP","TLS و SSL للقيام بعملية التشفير","NAT"],2],[256,"بروتوكول BGP يستخدم لـ:",["نقل الملفات","تبادل معلومات التوجيه عبر شبكة الإنترنت","إدارة الأجهزة","تصفح الويب"],1],[257,"الحقول المسؤولة عن اكتشاف الأخطاء في ترويسة TCP:",["Window فقط","Port فقط","Flags فقط","Sequence number وAcknowledgment وChecksum"],3],[258,"التحكم بتدفق البيانات في TCP Flow Control يتم من خلال:",["MAC","DHCP","TTL","window size"],3],[259,"أكبر حجم لحقل window بدون خيارات:",["65535 bytes","255 bytes","1024 bytes","1500 bytes"],0],[260,"UDP يقلل من تعقيد عملية الإرسال لأنه:",["يستخدم مصافحة","يؤكد كل حزمة","لا يبدأ بتأسيس الاتصال ولا يتأكد من وصول البيانات","يؤسس اتصالاً معقداً"],2],[261,"ترويسة UDP تحتوي على الحقول:",["Source and Destination Port وLength وChecksum","Sequence وAcknowledgment","Flags وWindow","TTL وProtocol"],0],[262,"يعمل Proxy Server في الطبقة:",["السابعة (Application Layer)","الثانية","الأولى","الثالثة"],0],[263,"عند استخدام البروكسي يكون عنوان IP الخاص بك:",["ظاهراً","مشفراً فقط","يتغير MAC","مخفياً عن الموقع لأنه تعامل مع البروكسي وليس معك"],3],[264,"من أسباب استخدام البروكسي:",["زيادة المواقع المحجوبة","إلغاء الأمان","التحكم في استخدام الإنترنت للموظفين والأطفال","إلغاء الراوتر"],2]];
const LECS=[
 ["أساسيات الشبكات وأجهزة الشبكة ونموذج TCP/IP",1,39],
 ["نموذج OSI وشبكات Ethernet والسويتش",40,69],
 ["حلقات الطبقة الثانية وبروتوكول STP وشبكات VLAN",70,87],
 ["الشبكات اللاسلكية",88,134],
 ["بروتوكول IP والطبقة الثالثة وعنونة IPv4",135,167],
 ["DHCP وARP وتوجيه الحزم وبروتوكولات التوجيه وICMP",168,206],
 ["نظام أسماء النطاقات DNS وبروتوكول IPv6",207,229],
 ["طبقة Transport: بروتوكولا TCP وUDP وخادم Proxy",230,264]
];
const L=['أ','ب','ج','د'], KEY='netq.v1';
let st={ans:{},lec:0,theme:'dark'}, filter='all';
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s)st=Object.assign(st,s)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
const $=id=>document.getElementById(id);
const qs=i=>D.filter(q=>q[0]>=LECS[i][1]&&q[0]<=LECS[i][2]);
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
// wrap Latin runs so they keep LTR order inside Arabic text
const fmt=s=>esc(s).replace(/([A-Za-z0-9][A-Za-z0-9 .:\/\\\-+,_()]*[A-Za-z0-9)]|[A-Za-z0-9])/g,m=>'<span class="ltr">'+m+'</span>');

function theme(){document.documentElement.dataset.theme=st.theme;$('theme').textContent=st.theme==='dark'?'☀':'☾'}
function counts(list){let a=0,c=0;list.forEach(q=>{if(q[0] in st.ans){a++;if(st.ans[q[0]]===q[3])c++}});return{a,c,w:a-c,n:list.length}}

function renderTabs(){
  $('tabs').innerHTML=LECS.map((l,i)=>{const c=counts(qs(i));
    return `<button class="tab${c.a===c.n?' done':''}" role="tab" aria-selected="${i===st.lec}" data-i="${i}">المحاضرة ${i+1}<small>${c.a}/${c.n}</small></button>`}).join('');
  const t=counts(D);$('total').innerHTML=`<b>${t.c}</b> صحيح من <b>${t.a}</b> مجاب · ${t.n} سؤال`;
}
function renderStats(){
  const list=qs(st.lec),c=counts(list);
  $('stats').innerHTML=`<span>مجاب <b>${c.a}/${c.n}</b></span><span class="ok">صحيح <b>${c.c}</b></span><span class="bad">خاطئ <b>${c.w}</b></span>`;
  $('bar').style.width=(c.a/c.n*100)+'%';
  renderTabs();
  const end=$('end');
  if(c.a===c.n){const p=Math.round(c.c/c.n*100),nx=st.lec<LECS.length-1;
    end.innerHTML=`<div class="result"><div class="big">${c.c} / ${c.n}</div><p>نسبة الإجابات الصحيحة ${p}%</p>${nx?'<button class="btn" id="next">المحاضرة التالية</button>':''}</div>`;
    const b=$('next');if(b)b.onclick=()=>go(st.lec+1);
  }else end.innerHTML='';
}
function card(q){
  const a=st.ans[q[0]],done=a!==undefined,ok=a===q[3];
  const opts=q[2].map((o,i)=>{
    let cls='opt';if(done){if(i===q[3])cls+=' right';else if(i===a)cls+=' wrong';else cls+=' dim'}
    const mark=done&&i===q[3]?'✓':done&&i===a?'✗':L[i];
    return `<button class="${cls}" data-q="${q[0]}" data-i="${i}" ${done?'disabled':''}><span class="lt">${mark}</span><span class="ot">${fmt(o)}</span></button>`}).join('');
  const fb=done?(ok?`<div class="fb ok">✓ إجابة صحيحة</div>`:`<div class="fb bad">✗ إجابة خاطئة <span class="sub">— الصحيحة: ${L[q[3]]}</span></div>`):'';
  return `<article class="card${done?(ok?' ok':' bad'):''}" id="q${q[0]}"><div class="qhead"><span class="num">${q[0]}</span><p class="q">${fmt(q[1])}</p></div><div class="opts">${opts}</div>${fb}</article>`;
}
function renderList(){
  let list=qs(st.lec);
  if(filter==='todo')list=list.filter(q=>!(q[0] in st.ans));
  if(filter==='wrong')list=list.filter(q=>q[0] in st.ans&&st.ans[q[0]]!==q[3]);
  $('list').innerHTML=list.length?list.map(card).join(''):'<p class="empty">لا توجد أسئلة في هذا العرض.</p>';
}
function go(i){st.lec=i;filter='all';document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.f==='all'));save();renderAll();window.scrollTo({top:0})}
function renderAll(){
  const l=LECS[st.lec];$('title').textContent=`المحاضرة ${st.lec+1}: ${l[0]}`;
  $('range').textContent=`${l[2]-l[1]+1} سؤالاً · من السؤال ${l[1]} إلى ${l[2]}`;
  renderStats();renderList();
}
$('tabs').onclick=e=>{const b=e.target.closest('.tab');if(b)go(+b.dataset.i)};
$('list').onclick=e=>{
  const b=e.target.closest('.opt');if(!b||b.disabled)return;
  const n=+b.dataset.q,i=+b.dataset.i,q=D[n-1];
  st.ans[n]=i;save();
  const el=$('q'+n);el.outerHTML=card(q);
  $('live').textContent=i===q[3]?'إجابة صحيحة':'إجابة خاطئة، الصحيحة '+L[q[3]];
  renderStats();
};
document.querySelector('.seg').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  filter=b.dataset.f;document.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',x===b));renderList()};
$('reset').onclick=()=>{if(!confirm('مسح إجابات هذه المحاضرة والبدء من جديد؟'))return;
  qs(st.lec).forEach(q=>delete st.ans[q[0]]);save();filter='all';
  document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.f==='all'));renderAll()};
$('theme').onclick=()=>{st.theme=st.theme==='dark'?'light':'dark';save();theme()};
theme();renderAll();
</script>
</body>
